openapi: 3.0.1
info:
  title: Organization Provisioning API
  description: |-
    Asynchronous, orchestrator-driven organization provisioning.

    `POST /organizations` accepts a create/retry request and drives a sequence of up to 13 provisioning steps — `INITIAL_REQUEST_VALIDATION` always first, then up to 12 further external provisioning steps. `org_uid` is the idempotency/retry key: resubmitting the same `org_uid` resumes a previously FAILED job at its failed step (fail-fast — later steps never ran) instead of starting over. `source` (e.g. `DEFAULT`, `ETL_JOB`, `ADMIN_APP`) independently restricts which steps are even seeded for the job at all (`source_config.json`) — a step outside that set never gets a row and is absent from every response, not reported `SKIPPED`; `org_type` then decides which of the *seeded* steps apply (`default_config.json`), and only that gate is ever surfaced as `SKIPPED`. `INITIAL_REQUEST_VALIDATION` runs synchronously: an invalid request never starts the background workflow and the call returns immediately with `status: FAILED`, the `external_job_uid`, and the failed step's error (and, since `source` was never resolved, `steps` has exactly one entry). Otherwise the remaining steps run asynchronously and `202 Accepted` is returned. `GET /organization-provision-jobs/{jobId}` returns the full workflow state — per-step status for every step `source` selected (including `SKIPPED` ones that don't apply to the org tier), the current step, and progress — for a UI to poll and render.
  contact:
    name: create-org-poc
    url: https://github.com/bora-arch/create-org-poc
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Local development server
tags:
- name: Organizations
  description: Kick off (or retry) organization provisioning workflows
- name: Provision Jobs
  description: Poll the state of an organization provisioning workflow
paths:
  /organizations:
    post:
      tags:
      - Organizations
      summary: Create (or retry) an organization provisioning job
      description: "org_uid is the idempotency/retry key: resubmitting the same\
        \ org_uid resumes a previously failed job from its failed step (fail-fast\
        \ — later steps never ran) instead of starting over. source identifies the\
        \ calling system and restricts which steps run at all (source_config.json),\
        \ independent of org_type, which separately decides which of the selected\
        \ steps apply. INITIAL_REQUEST_VALIDATION always runs first and, when it\
        \ runs, runs synchronously: an invalid request never starts the async workflow\
        \ and this call returns immediately with status FAILED, the external_job_uid,\
        \ and the failed step's error. Otherwise the remaining steps run asynchronously\
        \ and 202 Accepted is returned; poll GET /organization-provision-jobs/{jobId}\
        \ for progress."
      operationId: createOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
        required: true
      responses:
        "400":
          description: Request validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Request rejected by INITIAL_REQUEST_VALIDATION (status FAILED),
            or the job for this org_uid was already SUCCESS/IN_PROGRESS and was
            not restarted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProvisionJobResponse"
        "202":
          description: Provisioning (re)started asynchronously
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProvisionJobResponse"
  /organization-provision-jobs/{jobId}:
    get:
      tags:
      - Provision Jobs
      summary: Get provisioning job state
      description: "Returns the full workflow state for a job — overall status, the\
        \ current step, progress, total steps, and the per-step list, scoped to the\
        \ steps the job's source selected (including SKIPPED entries among those for\
        \ steps that don't apply to the org tier — steps source never selected are\
        \ absent from the list rather than SKIPPED)."
      operationId: getJob
      parameters:
      - name: jobId
        in: path
        description: Provisioning job id returned by POST /organizations
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: No provisioning job exists for the given id
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "200":
          description: Current workflow state
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProvisionJobResponse"
components:
  schemas:
    CreateOrganizationRequest:
      required:
      - org_uid
      - org_type
      - source
      - service_user_account
      - external_job_uid
      type: object
      properties:
        org_uid:
          maxLength: 255
          minLength: 0
          type: string
          description: Client-supplied organization identifier (UUID). Also the
            idempotency/retry key — resubmitting the same org_uid resumes a failed
            job from its failed step instead of starting over.
          example: 3f2a9c14-7b41-4e2a-9c31-8a2f6d1eb7d2
        org_type:
          maxLength: 64
          minLength: 0
          type: string
          description: Organization tier; selects the config profile that decides
            which of the steps source seeded run vs. are SKIPPED. Must exactly match
            one of the OrgType enum constants: STANDARD, INTERNAL, ENTERPRISE.
          example: STANDARD
        source:
          maxLength: 64
          minLength: 0
          type: string
          description: Identifies the calling system; selects the fixed set of steps
            that are even seeded for this job (source_config.json) — steps outside
            that set never get a row and never appear in any response for this job,
            independent of org_type. Must exactly match a configured source, e.g.
            DEFAULT, ETL_JOB, ADMIN_APP.
          example: DEFAULT
        service_user_account:
          maxLength: 255
          minLength: 0
          type: string
          description: Email of the service account provisioning is performed on
            behalf of
          example: sav20006@gmail.com
        external_job_uid:
          maxLength: 255
          minLength: 0
          type: string
          description: Caller-supplied job identifier, echoed back in every response
          example: external_job_uid
      description: |-
        Request to provision a new organization, or retry a failed one.

        Fields are validated in two stages: structural presence (400 Bad
        Request if a field is missing/blank) here at the HTTP boundary, and
        format/semantic validity (is org_uid really a UUID, is org_type a
        known tier, is source a configured source) by the
        INITIAL_REQUEST_VALIDATION workflow step — a malformed value
        produces a normal step-failure response (200, status FAILED)
        rather than a raw deserialization error.
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
          format: int32
          example: 400
        error:
          type: string
          description: "Short, machine-readable error code"
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable error message
          example: Request validation failed
        timestamp:
          type: string
          description: When the error was generated
          format: date-time
          example: 2026-07-08T12:34:56Z
        violations:
          type: array
          description: Field-level validation violations; present only for validation
            errors
          items:
            $ref: "#/components/schemas/FieldViolation"
      description: Standard error payload returned for 4xx/5xx responses
    FieldViolation:
      type: object
      properties:
        field:
          type: string
          description: Offending request field
          example: org_uid
        message:
          type: string
          description: Why the field is invalid
          example: must not be blank
      description: A single field validation violation
    ProvisionJobResponse:
      type: object
      properties:
        jobId:
          type: string
          description: Provisioning job id
          format: uuid
          example: 8b1b2f2c-4a11-4e7a-9c6b-7a1c3b2a0e11
        orgUid:
          type: string
          description: Client-supplied organization identifier from the request;
            also the retry key
          example: 3f2a9c14-7b41-4e2a-9c31-8a2f6d1eb7d2
        externalJobUid:
          type: string
          description: Caller-supplied job identifier, echoed back from the request
          example: external_job_uid
        source:
          type: string
          description: Calling system identified by the request; selects the fixed
            set of steps that were even seeded for this job, independent of orgType
            — steps outside that set are absent from `steps` entirely. Null until
            INITIAL_REQUEST_VALIDATION resolves it (in which case `steps` has only
            the INITIAL_REQUEST_VALIDATION entry).
          example: DEFAULT
        status:
          type: string
          description: Overall workflow status
          example: IN_PROGRESS
          enum:
          - PENDING
          - IN_PROGRESS
          - SUCCESS
          - FAILED
        currentStep:
          type: string
          description: Step currently executing; null once the job reaches a terminal
            state
          example: SETUP_DEFAULT_BRANDING_PRM_PREFERENCES
          enum:
          - INITIAL_REQUEST_VALIDATION
          - CREATE_ORG_IN_FSP
          - SETUP_ORG_IN_FSP
          - ASSIGN_FSP_RECOMMENDATION_MODELS
          - SETUP_DEFAULT_BRANDING_PRM_PREFERENCES
          - SETUP_DEFAULT_PRM_PREFERENCES
          - SETUP_DEFAULT_RFS_UI_PRM_PREFERENCES
          - SETUP_DEFAULT_VOCABULARIES_IN_CE
          - SETUP_DEFAULT_DATASOURCES_IN_FSP
          - SETUP_DEFAULT_CITATIONS
          - ENABLE_PRM_LICENSES
          - DISABLE_PRM_LICENSES
          - SETUP_FSP_BOOSTERS
        progress:
          type: integer
          description: Number of steps (among those source seeded) that have reached
            a terminal state (SUCCESS or SKIPPED)
          format: int32
          example: 4
        totalSteps:
          type: integer
          description: Total number of steps seeded for this job — i.e. the size of
            source's configured step set (plus INITIAL_REQUEST_VALIDATION), not the
            full catalog. 1 if source hasn't been resolved yet.
          format: int32
          example: 13
        steps:
          type: array
          description: "Per-step status, in execution order. Only contains steps
            source selected — a step outside that set is never included, not even
            as NOT_STARTED/SKIPPED."
          items:
            $ref: "#/components/schemas/ProvisionStepResponse"
      description: Full provisioning workflow state for a job
    ProvisionStepResponse:
      type: object
      properties:
        name:
          type: string
          description: Step identifier
          example: INITIAL_REQUEST_VALIDATION
          enum:
          - INITIAL_REQUEST_VALIDATION
          - CREATE_ORG_IN_FSP
          - SETUP_ORG_IN_FSP
          - ASSIGN_FSP_RECOMMENDATION_MODELS
          - SETUP_DEFAULT_BRANDING_PRM_PREFERENCES
          - SETUP_DEFAULT_PRM_PREFERENCES
          - SETUP_DEFAULT_RFS_UI_PRM_PREFERENCES
          - SETUP_DEFAULT_VOCABULARIES_IN_CE
          - SETUP_DEFAULT_DATASOURCES_IN_FSP
          - SETUP_DEFAULT_CITATIONS
          - ENABLE_PRM_LICENSES
          - DISABLE_PRM_LICENSES
          - SETUP_FSP_BOOSTERS
        status:
          type: string
          description: Step status
          example: SUCCESS
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - SUCCESS
          - FAILED
          - SKIPPED
        errorCode:
          type: string
          description: Error code from the failed step; present only when status
            is FAILED. VALIDATION_FAILED for INITIAL_REQUEST_VALIDATION, otherwise
            the downstream call's error code
          example: "401"
        errorMessage:
          type: string
          description: Error message from the failed step; present only when status
            is FAILED
          example: Unauthorized
      description: Status of a single provisioning step
